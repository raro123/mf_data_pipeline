[project]
name = "mf-data-pipeline"
version = "0.1.0"
description = "Scheduled source-data pipelines for Indian mutual-fund analysis"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3",
    "botocore",
    "duckdb",
    "kiteconnect",
    "numpy",
    "openpyxl",
    "pandas>=2.3,<3",
    "pyarrow",
    "python-dotenv",
    "requests",
    "xlrd",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
