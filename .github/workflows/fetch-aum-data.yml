name: Quarterly Scheme-wise AUM Extraction

on:
  schedule:
    - cron: '0 2 10 1,4,7,10 *'
  workflow_dispatch:

jobs:
  fetch-aum:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        python-version: '3.12'
        enable-cache: true
        cache-dependency-glob: 'requirements.txt'

    - name: Install dependencies
      run: |
        uv venv
        uv pip install -r requirements.txt

    - name: Fetch and publish scheme-wise AUM
      run: uv run python -m scripts.fetch_aum_data

    - name: Dispatch datalake AUM ingestion
      env:
        GH_TOKEN: ${{ secrets.DATALAKE_DISPATCH_TOKEN }}
      run: |
        gh api --method POST repos/raro123/datalake/dispatches \
          -f event_type=mf-aum-raw-ingestion-completed \
          -f "client_payload[source_repository]=${{ github.repository }}" \
          -f "client_payload[source_workflow]=${{ github.workflow }}" \
          -f "client_payload[source_run_id]=${{ github.run_id }}" \
          -f "client_payload[source_run_attempt]=${{ github.run_attempt }}" \
          -f "client_payload[source_sha]=${{ github.sha }}"

    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: aum-extraction-logs-${{ github.run_number }}
        path: logs/
        retention-days: 7
