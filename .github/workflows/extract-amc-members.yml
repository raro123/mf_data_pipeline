name: Weekly AMC Member Extraction

on:
  schedule:
    # Run at 01:30 UTC Saturday (7:00 AM IST Saturday)
    - cron: '30 1 * * 6'
  workflow_dispatch:

jobs:
  extract-amc-members:
    runs-on: ubuntu-latest
    outputs:
      raw_run_attempt: ${{ github.run_attempt }}

    env:
      PYTHONPATH: ${{ github.workspace }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      AMFI_MEMBERS_TIMEOUT: ${{ vars.AMFI_MEMBERS_TIMEOUT || '30' }}
      MAX_RETRIES: ${{ vars.MAX_RETRIES || '3' }}
      RETRY_DELAY: ${{ vars.RETRY_DELAY || '5' }}
      ENVIRONMENT: production
      LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Run AMC member extraction
        run: uv run --locked --no-dev python -m scripts.extract_amc_members

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: amc-member-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7

  dispatch_datalake:
    needs: extract-amc-members
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5

    steps:
      - name: Dispatch datalake AMC member ingestion
        env:
          GH_TOKEN: ${{ secrets.DATALAKE_DISPATCH_TOKEN }}
        run: |
          test -n "${GH_TOKEN}" || {
            echo "DATALAKE_DISPATCH_TOKEN is not configured"
            exit 1
          }
          gh api --method POST repos/raro123/datalake/dispatches \
            -f event_type=mf-amc-members-raw-ingestion-completed \
            -f "client_payload[source_repository]=${{ github.repository }}" \
            -f "client_payload[source_workflow]=${{ github.workflow }}" \
            -f "client_payload[source_run_id]=${{ github.run_id }}" \
            -f "client_payload[source_run_attempt]=${{ needs.extract-amc-members.outputs.raw_run_attempt }}" \
            -f "client_payload[source_sha]=${{ github.sha }}"
