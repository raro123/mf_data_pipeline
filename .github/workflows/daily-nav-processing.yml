name: Daily NAV Data Processing

on:
  schedule:
    # Run at 06:30 UTC daily (12:00 PM IST) after late NAV publication.
    - cron: '30 6 * * *'
  workflow_dispatch:  # Allow manual triggering

jobs:
  process-daily-nav:
    runs-on: ubuntu-latest

    # Global environment variables for the job
    env:
      PYTHONPATH: ${{ github.workspace }}
      # R2 (Cloudflare) credentials
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      # API configuration
      AMFI_NAV_TIMEOUT: ${{ vars.AMFI_NAV_TIMEOUT || '30' }}
      AMFI_SCHEME_TIMEOUT: ${{ vars.AMFI_SCHEME_TIMEOUT || '30' }}
      MAX_RETRIES: ${{ vars.MAX_RETRIES || '3' }}
      RETRY_DELAY: ${{ vars.RETRY_DELAY || '5' }}
      # Processing configuration
      HISTORICAL_FETCH_DAYS: ${{ vars.HISTORICAL_FETCH_DAYS || '90' }}
      CHUNK_SIZE: ${{ vars.CHUNK_SIZE || '10000' }}
      # Environment settings
      ENVIRONMENT: production
      LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # Shallow clone for faster checkout (only latest commit needed)
        fetch-depth: 1

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: '3.12'
        enable-cache: true

    - name: Install dependencies
      run: uv sync --locked --no-dev

    - name: Create required directories
      run: |
        cd ${{ github.workspace }}
        uv run --locked --no-dev python -c "from config.settings import initialize_project; initialize_project()"

    - name: Run daily NAV transform script
      id: daily_transform
      run: |
        echo "Starting daily NAV transform script..."
        cd ${{ github.workspace }}
        uv run --locked --no-dev python -m scripts.fetch_daily_nav

    - name: Dispatch datalake NAV ingestion
      env:
        GH_TOKEN: ${{ secrets.DATALAKE_DISPATCH_TOKEN }}
      run: |
        gh api --method POST repos/raro123/datalake/dispatches \
          -f event_type=mf-nav-raw-ingestion-completed \
          -f "client_payload[source_repository]=${{ github.repository }}" \
          -f "client_payload[source_workflow]=${{ github.workflow }}" \
          -f "client_payload[source_run_id]=${{ github.run_id }}" \
          -f "client_payload[source_run_attempt]=${{ github.run_attempt }}" \
          -f "client_payload[source_sha]=${{ github.sha }}"

    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: processing-logs-${{ github.run_number }}
        path: logs/
        retention-days: 7

    - name: Notify on success
      if: success()
      run: |
        echo "✅ Daily NAV processing completed successfully at $(date)"

    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Daily NAV processing failed at $(date)"
        echo "Check the logs artifact for details"
