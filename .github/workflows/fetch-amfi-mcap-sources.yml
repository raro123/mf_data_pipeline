name: Archive AMFI Market-Cap Sources

on:
  schedule:
    - cron: '30 2 15 * *'
  workflow_dispatch:

concurrency:
  group: amfi-market-cap-source-archive
  cancel-in-progress: false

jobs:
  archive-sources:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      AMFI_MCAP_TIMEOUT: ${{ vars.AMFI_MCAP_TIMEOUT || '60' }}
      MAX_RETRIES: ${{ vars.MAX_RETRIES || '3' }}
      RETRY_DELAY: ${{ vars.RETRY_DELAY || '5' }}
      ENVIRONMENT: production
      LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: 'requirements.txt'

      - name: Install dependencies
        run: uv pip install -r requirements.txt

      - name: Archive AMFI market-cap workbooks
        run: uv run python -m scripts.fetch_amfi_mcap_sources

      - name: Upload archive logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: amfi-market-cap-source-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7
