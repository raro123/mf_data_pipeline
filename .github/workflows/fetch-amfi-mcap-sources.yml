name: AMFI Market-Cap Source and Raw Pipeline

on:
  schedule:
    - cron: '30 2 15 * *'
  workflow_dispatch:

concurrency:
  group: amfi-market-cap-raw-pipeline
  cancel-in-progress: false

jobs:
  archive-transform-dispatch:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      AMFI_MCAP_TIMEOUT: ${{ vars.AMFI_MCAP_TIMEOUT || '60' }}
      MAX_RETRIES: ${{ vars.MAX_RETRIES || '3' }}
      RETRY_DELAY: ${{ vars.RETRY_DELAY || '5' }}
      ENVIRONMENT: production
      LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Archive AMFI market-cap workbooks
        run: uv run --locked --no-dev python -m scripts.fetch_amfi_mcap_sources

      - name: Transform archived workbooks to raw Parquet
        run: uv run --locked --no-dev python -m scripts.transform_amfi_mcap_sources

      - name: Dispatch datalake market-cap ingestion
        env:
          GH_TOKEN: ${{ secrets.DATALAKE_DISPATCH_TOKEN }}
        run: |
          gh api --method POST repos/raro123/datalake/dispatches \
            -f event_type=mf-market-cap-raw-ingestion-completed \
            -f "client_payload[source_repository]=${{ github.repository }}" \
            -f "client_payload[source_workflow]=${{ github.workflow }}" \
            -f "client_payload[source_run_id]=${{ github.run_id }}" \
            -f "client_payload[source_run_attempt]=${{ github.run_attempt }}" \
            -f "client_payload[source_sha]=${{ github.sha }}"

      - name: Upload market-cap logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: amfi-market-cap-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7
